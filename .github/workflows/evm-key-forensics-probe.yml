name: EVM Key Forensics Probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/evm_key_forensics/**"
      - "tests/test_evm_key_forensics_probe_artifact.py"
      - ".github/workflows/evm-key-forensics-probe.yml"

permissions:
  contents: read

jobs:
  compile-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check pinned historical source pattern (inspection only)
        run: |
          set -euo pipefail
          source_url="https://raw.githubusercontent.com/johguse/profanity/0b54ffc86aafbb206675b4bfecb2ea09ac7a79f6/Dispatcher.cpp"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 "$source_url" -o /tmp/pinned-Dispatcher.cpp
          python - <<'PY'
          import hashlib
          from pathlib import Path

          source = Path("/tmp/pinned-Dispatcher.cpp").read_bytes()
          git_blob_sha1 = hashlib.sha1(b"blob " + str(len(source)).encode() + b"\0" + source).hexdigest()
          expected_blob_sha1 = "c9226fc02a52633a84664cbf3aaf2b4af8a59b25"
          assert git_blob_sha1 == expected_blob_sha1, {
              "expected_git_blob_sha1": expected_blob_sha1,
              "actual_git_blob_sha1": git_blob_sha1,
          }
          print(f"Pinned upstream Dispatcher.cpp blob: PASS ({git_blob_sha1})")
          PY
          python tools/evm_key_forensics/check_historical_source_pattern.py /tmp/pinned-Dispatcher.cpp --revision pre-disclosure --pretty > /tmp/source-pattern-pre.json
          post_url="https://raw.githubusercontent.com/johguse/profanity/186b9b27ab3e24a1899f648adcabcbf0e5f3131e/Dispatcher.cpp"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 "$post_url" -o /tmp/pinned-Dispatcher-post.cpp
          python tools/evm_key_forensics/check_historical_source_pattern.py /tmp/pinned-Dispatcher-post.cpp --revision post-disclosure --pretty > /tmp/source-pattern-post.json
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "/tmp/source-pattern-pre.json": "0b54ffc86aafbb206675b4bfecb2ea09ac7a79f6",
              "/tmp/source-pattern-post.json": "186b9b27ab3e24a1899f648adcabcbf0e5f3131e",
          }
          for filename, commit in expected.items():
              result = json.loads(Path(filename).read_text())
              assert result["conclusion"] == "SOURCE_PATTERN_MATCHED", result
              assert result["expected_upstream_commit"] == commit, result
              assert result["pinned_source_blob_matches"] is True, result
              assert result["historical_code_executed"] is False
              assert result["wallet_material_used"] is False
              assert result["historical_vulnerability_reproduced"] is False
          print("Both pinned source revisions match the reviewed pattern (source review only)")
          PY

      - name: Validate source evidence dossier
        run: |
          python tools/evm_key_forensics/validate_source_dossier.py docs/research/evm-key-forensics/SOURCE_EVIDENCE_DOSSIER.json
          python -m unittest tests.test_evm_key_forensics_dossier -v

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile diagnostic probe
        run: |
          g++ --version
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic \
            tools/evm_key_forensics/profanity_seed_environment_probe.cpp \
            -o profanity_seed_environment_probe

      - name: Validate JSON output and safety flags
        run: |
          ./profanity_seed_environment_probe 64 > probe-output.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("probe-output.json").read_text())
          assert data["schema_version"] == 1
          assert data["probe"] == "std_random_device_environment_diagnostic"
          assert data["historical_profanity_code_executed"] is False
          assert data["wallet_material_used"] is False
          assert data["observations_are_entropy_proof"] is False
          assert data["samples_requested"] == 64
          assert 1 <= data["distinct_values_observed"] <= 64
          assert isinstance(data["random_device_result_type_bits"], int)
          assert isinstance(data["random_device_reported_entropy"], (int, float))
          print("probe JSON and safety invariants: PASS")
          PY

      - name: Assemble portable evidence bundle
        run: |
          mkdir -p probe-evidence
          cp probe-output.json probe-evidence/probe-output.json
          cp tools/evm_key_forensics/profanity_seed_environment_probe.cpp probe-evidence/probe-source.cpp
          cp profanity_seed_environment_probe probe-evidence/probe-binary
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          root = Path("probe-evidence")

          def sha256(path):
              return hashlib.sha256((root / path).read_bytes()).hexdigest()

          metadata = {
              "schema_version": 1,
              "purpose": "diagnostic_environment_observation_only",
              "git_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": platform.platform(),
              "compiler_version": subprocess.check_output(
                  ["g++", "--version"], text=True
              ).splitlines()[0],
              "build_flags": ["-std=c++11", "-O2", "-Wall", "-Wextra", "-Werror", "-pedantic"],
              "source_sha256": sha256("probe-source.cpp"),
              "binary_sha256": sha256("probe-binary"),
              "output_sha256": sha256("probe-output.json"),
              "historical_vulnerability_reproduced": False,
              "entropy_proven": False,
          }
          (root / "probe-run-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(metadata, indent=2, sort_keys=True))
          PY

      - name: Verify exported evidence bundle
        run: |
          python tools/evm_key_forensics/verify_probe_artifact.py probe-evidence

      - name: Reject invalid sample counts
        run: |
          set +e
          ./profanity_seed_environment_probe 0 >/tmp/probe-out.txt 2>/tmp/probe-err.txt
          status=$?
          set -e
          test "$status" -eq 2
          grep -q "sample_count_must_be_between_1_and_10000" /tmp/probe-err.txt

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: evm-key-forensics-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe-evidence/
          if-no-files-found: error
          retention-days: 30
