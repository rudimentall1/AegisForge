name: Foundry runner integration

on:
  pull_request:
    branches:
      - main
      - master
      - feat/aegisforge-working-state-2026-11-18
    paths:
      - "agents/security_checker/foundry_runner.py"
      - "agents/security_checker/anvil_fork_runner.py"
      - "agents/security_checker/fork_execution_plan.py"
      - "agents/security_checker/fork_runtime_orchestrator.py"
      - "agents/security_checker/fork_compose_validator.py"
      - "agents/security_checker/fork_compose_resolver.py"
      - "tests/test_fork_compose_resolver.py"
      - "tests/test_fork_execution_plan.py"
      - "tests/test_fork_runtime_orchestrator.py"
      - "tests/test_fork_compose_validator.py"
      - "requirements.txt"
      - "shared/sandbox.py"
      - "tests/test_foundry_dynamic_runner_integration.py"
      - "tests/test_anvil_fork_runner_integration.py"
      - "tests/test_anvil_fork_deployment_topology.py"
      - "tests/test_anvil_fork_egress_firewall.py"
      - "tests/test_anvil_fork_egress_runtime.py"
      - "tests/test_anvil_fork_compose_runtime.py"
      - "tests/fixtures/anvil-fork-compose-runtime.override.yaml"
      - "deploy/anvil-fork/**"
      - ".github/workflows/foundry-runner-integration.yml"
  push:
    branches:
      - main
      - master
      - feat/aegisforge-working-state-2026-11-18
    paths:
      - "agents/security_checker/fork_compose_validator.py"
      - "agents/security_checker/fork_compose_resolver.py"
      - "agents/security_checker/fork_runtime_orchestrator.py"
      - "tests/test_fork_compose_validator.py"
      - "tests/test_fork_compose_resolver.py"
      - "tests/test_fork_runtime_orchestrator.py"
      - "requirements.txt"
      - "agents/security_checker/foundry_runner.py"
      - "shared/sandbox.py"
      - "tests/test_foundry_dynamic_runner_integration.py"
      - "tests/test_anvil_fork_runner_integration.py"
      - "tests/test_anvil_fork_deployment_topology.py"
      - "tests/test_anvil_fork_egress_firewall.py"
      - "tests/test_anvil_fork_egress_runtime.py"
      - "tests/test_anvil_fork_compose_runtime.py"
      - "tests/fixtures/anvil-fork-compose-runtime.override.yaml"
      - "deploy/anvil-fork/**"
      - ".github/workflows/foundry-runner-integration.yml"

permissions:
  contents: read

jobs:
  isolated-foundry:
    name: Real networkless Foundry container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest solc-select==1.2.0 "PyYAML>=6.0,<7.0"

      - name: Pull official Foundry image and capture immutable digest
        run: |
          set -euo pipefail
          image_tag="ghcr.io/foundry-rs/foundry:latest"
          docker pull "$image_tag"
          image_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image_tag")"
          case "$image_digest" in
            ghcr.io/foundry-rs/foundry@sha256:*) ;;
            *) echo "Unexpected Foundry image digest: $image_digest" >&2; exit 1 ;;
          esac
          echo "AEGISFORGE_FOUNDRY_IMAGE=$image_digest" >> "$GITHUB_ENV"
          python_image_tag="python:3.12-slim"
          docker pull "$python_image_tag"
          python_image_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$python_image_tag")"
          case "$python_image_digest" in
            *python@sha256:*) ;;
            *) echo "Unexpected Python image digest: $python_image_digest" >&2; exit 1 ;;
          esac
          echo "AEGISFORGE_PYTHON_IMAGE=$python_image_digest" >> "$GITHUB_ENV"
          echo "AEGISFORGE_AUTO_INSTALL_SOLC=1" >> "$GITHUB_ENV"
          echo "AEGISFORGE_FOUNDRY_INTEGRATION=1" >> "$GITHUB_ENV"
          echo "AEGISFORGE_ANVIL_FORK_INTEGRATION=1" >> "$GITHUB_ENV"
          solc-select install 0.8.20
          echo "Foundry image pinned for this run: $image_digest"

      - name: Resolve and validate effective Docker Compose configuration
        env:
          AEGISFORGE_RPC_GATEWAY_UPSTREAM_URL: https://rpc-provider.example/v1/ci-validation
          AEGISFORGE_RPC_GATEWAY_ALLOWED_HOSTS: rpc-provider.example
          AEGISFORGE_ANVIL_CHAIN_ID: "31337"
          AEGISFORGE_ANVIL_FORK_BLOCK_NUMBER: "1"
        run: |
          set -euo pipefail
          export AEGISFORGE_RPC_GATEWAY_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(36))')"
          python - <<'PY'
          import os
          from agents.security_checker.fork_compose_resolver import (
              resolve_anvil_fork_compose,
          )

          resolved = resolve_anvil_fork_compose(
              runtime_config={
                  "upstream_url": os.environ["AEGISFORGE_RPC_GATEWAY_UPSTREAM_URL"],
                  "allowed_hosts": [os.environ["AEGISFORGE_RPC_GATEWAY_ALLOWED_HOSTS"]],
                  "bearer_token": os.environ["AEGISFORGE_RPC_GATEWAY_TOKEN"],
                  "foundry_image": os.environ["AEGISFORGE_FOUNDRY_IMAGE"],
              },
              fork_chain_id=31337,
              fork_block_number=1,
          )
          assert resolved["name"] == "aegisforge-anvil-fork"
          print("Compose source and effective interpolation: PASS")
          PY

      - name: Validate generated nftables policy without applying it
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nftables iproute2
          sudo python deploy/anvil-fork/install_egress_firewall.py --provider-cidr 8.8.8.8/32
          sudo "$(command -v python)" -m pytest -q tests/test_anvil_fork_egress_runtime.py

      - name: Verify real Docker Compose network and firewall isolation
        env:
          AEGISFORGE_DOCKER_FIREWALL_RUNTIME: "1"
        run: |
          python -m pytest -vv -s tests/test_anvil_fork_compose_runtime.py

      - name: Execute real Solidity test in isolated container
        run: |
          python -m pytest -q tests/test_foundry_dynamic_runner_integration.py tests/test_anvil_fork_runner_integration.py tests/test_anvil_fork_deployment_topology.py tests/test_anvil_fork_egress_firewall.py tests/test_fork_execution_plan.py tests/test_fork_runtime_orchestrator.py tests/test_fork_compose_validator.py tests/test_fork_compose_resolver.py
