name: AegisForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Compile Python
        run: |
          python -m compileall -q \
            agents \
            orchestrator \
            shared \
            model_research \
            scam_intelligence \
            tests

      - name: Check whitespace
        run: git diff --check

      - name: Run tests
        run: python -m pytest -q
