name: On-chain source pipeline tests

on:
  pull_request:
    paths:
      - "agents/source_researcher/**"
      - "agents/crypto_analyst/**"
      - "agents/security_checker/agent.py"
      - "scam_intelligence/contract_intake.py"
      - "shared/onchain_*.py"
      - "shared/solidity_source_analysis.py"
      - "shared/queue.py"
      - "agents/worker.py"
      - "tests/test_onchain_*.py"
      - "tests/test_solidity_source_analysis.py"
      - ".github/workflows/onchain-source-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onchain-source-tests:
    name: On-chain intake and source reasoning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest
      - name: Compile on-chain pipeline modules
        run: |
          python -m compileall -q             agents/source_researcher             agents/crypto_analyst             agents/security_checker/agent.py             scam_intelligence/contract_intake.py             shared/onchain_research_case.py             shared/onchain_target_store.py             shared/solidity_source_analysis.py             shared/queue.py             tests
      - name: Run focused on-chain source tests
        run: |
          python -m pytest -q --tb=short             tests/test_onchain_standard_json_provenance.py             tests/test_onchain_source_pipeline.py             tests/test_onchain_research_case.py             tests/test_solidity_source_analysis.py
